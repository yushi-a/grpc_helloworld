name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
  # feature ブランチから手動でイメージを push したいときに使う。
  # 実行できるのは write 権限を持つユーザーのみ。
  workflow_dispatch:
    inputs:
      image_tag:
        description: "イメージタグ (省略時はコミット SHA)"
        required: false
        type: string
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
  docker:
    runs-on: ubuntu-latest
    env:
      # push イベント (master / v* タグ) と手動実行のときだけ DockerHub へ push する。
      # PR ではビルドが通ることの検証だけを行う。
      PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      # 手動実行でタグが指定されなければコミット SHA を使う。
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # PR ではレジストリへ push しないので認証も不要。
        # Dependabot や fork からの PR には Actions secrets が渡らず、
        # ログインを試みると必ず失敗するためスキップする。
        name: Login to DockerHub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.PUSH_IMAGE }}
          tags: "${{ env.PUSH_IMAGE == 'true' && format('{0}/grpc_helloworld:{1}', secrets.DOCKER_USERNAME, env.IMAGE_TAG) || format('grpc_helloworld:{0}', github.sha) }}"
      -
        name: Image digest
        if: env.PUSH_IMAGE == 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}
