name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        # PR ではレジストリへ push しないので認証も不要。
        # Dependabot や fork からの PR には Actions secrets が渡らず、
        # ログインを試みると必ず失敗するためスキップする。
        name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        # push イベント (master / v* タグ) のみ DockerHub へ push する。
        # PR ではビルドが通ることの検証だけを行う。
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name == 'push' }}
          tags: "${{ github.event_name == 'push' && format('{0}/grpc_helloworld:{1}', secrets.DOCKER_USERNAME, github.sha) || format('grpc_helloworld:{0}', github.sha) }}"
      -
        name: Image digest
        if: github.event_name == 'push'
        run: echo ${{ steps.docker_build.outputs.digest }}
